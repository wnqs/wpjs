                    var c2='【组合2-汇能最低】汇能'+minH.hui.toFixed(2)+'% + 先机'+minH.xian.toFixed(1)+'%'+(isA?'':td+minH.tuan.toFixed(0));
                    outputC=minX.xian===minH.xian&&minX.hui===minH.hui?c1:c1+'\n'+c2;
                    results=minX.results;
                }
            }else if(isHE&&!isXE){
                var found=false,bestH=0,bestT=0,bestR=null,tuanVals=tuan===-1?function(){var a=[];for(var i=0;i<=200;i+=1)a.push(i);return a;}():[tuan];
                for(var ti=0;ti<tuanVals.length&&!found;ti++){var tn=tuanVals[ti],ht=0;while(ht<=maxH&&!found){
                    if(_calc_canAchieve(cs,ht,xian,tn,isA,vn)){var r=_calc_calcAll(vn,ht,xian,tn);if(r&&r.every(function(x){return x.passed})){found=true;bestH=ht;bestT=tn;bestR=r;}}
                    ht=Math.round((ht+0.25)*100)/100;}}
                if(found){outputC='汇能'+bestH.toFixed(2)+'% + 先机'+xian.toFixed(1)+'%'+(isA?'':' + 团魂'+bestT.toFixed(0));results=bestR;}
                else{outputC='未找到满足要求的汇能组合';}
            }else if(!isHE&&isXE){
                var found=false,bestX=0,bestT=0,bestR=null,tuanVals=tuan===-1?function(){var a=[];for(var i=0;i<=200;i+=1)a.push(i);return a;}():[tuan];
                for(var ti=0;ti<tuanVals.length&&!found;ti++){var tn=tuanVals[ti],xt=0;while(xt<=maxX&&!found){
                    if(_calc_canAchieve(cs,hui,xt,tn,isA,vn)){var r=_calc_calcAll(vn,hui,xt,tn);if(r&&r.every(function(x){return x.passed})){found=true;bestX=xt;bestT=tn;bestR=r;}}
                    xt=Math.round((xt+0.1)*10)/10;}}
                if(found){outputC='汇能'+hui.toFixed(2)+'% + 先机'+bestX.toFixed(1)+'%'+(isA?'':' + 团魂'+bestT.toFixed(0));results=bestR;}
                else{outputC='未找到满足要求的先机组合';}
            }else{
                var found=false,bestT=0,bestR=null,tuanVals=tuan===-1?function(){var a=[];for(var i=0;i<=200;i+=1)a.push(i);return a;}():[tuan];
                for(var ti=0;ti<tuanVals.length&&!found;ti++){var tn=tuanVals[ti];
                    if(_calc_canAchieve(cs,hui,xian,tn,isA,vn)){var r=_calc_calcAll(vn,hui,xian,tn);if(r&&r.every(function(x){return x.passed})){found=true;bestT=tn;bestR=r;}}}
                if(found){outputC='汇能'+hui.toFixed(2)+'% + 先机'+xian.toFixed(1)+'%'+(isA?'':' + 团魂'+bestT.toFixed(0));results=bestR;}
                else{outputC='未找到满足要求的团魂组合';}
            }
            document.getElementById('_calc_outputSummary').innerHTML='车辆: '+vn+' | 氮气配置: '+document.getElementById('_calc_nitroConfig').value+' | 专精: '+(document.getElementById('_calc_zhuanjing').value==='yes'?'是':'否')+' | 猎芯: '+(document.getElementById('_calc_liexin').value==='yes'?'是':'否');
            document.getElementById('_calc_outputCombination').innerHTML='<div class="combination-result"><span class="label">'+(isA?'先机+汇能组合：':'先机+汇能+团魂组合：')+'</span><br><br><span class="value">'+outputC.replace(/\n/g,'<br>')+'</span></div>';
            if(results&&results.length){document.getElementById('_calc_outputDetail').innerHTML=_calc_buildDetail(results);}
            else{document.getElementById('_calc_outputDetail').innerHTML='<div class="output-block" style="border-left-color:#f28b82;"><span class="text-red">❌ 未找到满足条件的组合</span></div>';}
        });
        
        // ===== 复制结果 =====
        document.getElementById('_calc_copyResultBtn').addEventListener('click',function(){
            var texts=[];
            texts.push(document.getElementById('_calc_outputSummary').textContent);
            texts.push('');
            var combo=document.querySelector('#_calc_outputCombination .value');
            if(combo)texts.push('组合: '+combo.textContent);
            texts.push('');
            document.querySelectorAll('#_calc_outputDetail .output-block').forEach(function(block){
                var strong=block.querySelector('.flex-wrap strong');
                var detail=block.querySelector('.detail-content');
                if(strong){texts.push(strong.textContent.trim());if(detail)texts.push(detail.textContent.trim());texts.push('');}
            });
            var result=texts.join('\n');
            if(navigator.clipboard){navigator.clipboard.writeText(result).then(function(){alert('已复制！');}).catch(function(){alert('复制失败');});}
        });
        
        // ===== 重置 =====
        document.getElementById('_calc_resetBtn').addEventListener('click',function(){if(confirm('确定重置？页面将刷新！'))location.reload();});
        
        // ===== 截图 =====
        document.getElementById('_calc_screenshotBtn').addEventListener('click',function(){
            if(!window.html2canvas){alert('截图库加载中，请稍后再试');return;}
            var oa=document.getElementById('_calc_outputArea');
            var dcs=oa.querySelectorAll('.detail-content'),dts=oa.querySelectorAll('.detail-toggle');
            var states=[];dcs.forEach(function(el,i){states.push(el.classList.contains('show'));if(!el.classList.contains('show')){el.classList.add('show');if(dts[i]){var t=dts[i].querySelector('.dt-txt');if(t)t.textContent='收起详情';var ch=dts[i].querySelector('.dt-chev');if(ch)ch.classList.add('open');}}});
            var btn=this,ot=btn.textContent;btn.textContent='生成中...';btn.disabled=true;
            html2canvas(oa,{scale:2,backgroundColor:'#0e1327',useCORS:true,logging:false}).then(function(canvas){
                dcs.forEach(function(el,i){if(!states[i]){el.classList.remove('show');if(dts[i]){var t=dts[i].querySelector('.dt-txt');if(t)t.textContent='查看详情';var ch=dts[i].querySelector('.dt-chev');if(ch)ch.classList.remove('open');}}});
                var lnk=document.createElement('a');lnk.download=(document.getElementById('_calc_vehicleSelect').value||'车辆')+' 芯片计算结果.png';lnk.href=canvas.toDataURL('image/png');lnk.click();
                btn.textContent='✅ 已生成';setTimeout(function(){btn.textContent=ot;btn.disabled=false;},2000);
            }).catch(function(){dcs.forEach(function(el,i){if(!states[i]){el.classList.remove('show');if(dts[i]){var t=dts[i].querySelector('.dt-txt');if(t)t.textContent='查看详情';var ch=dts[i].querySelector('.dt-chev');if(ch)ch.classList.remove('open');}}});btn.textContent=ot;btn.disabled=false;alert('截图失败');});
        });
    })();
};

window._calc_toggleCollapsible = function(h) {
    var uR = h.closest('.uR');
    var b = uR ? uR.querySelector('.collapsible-body') : null;
    var a = h.querySelector('.collapse-arrow');
    if(b){b.classList.toggle('hidden');if(a)a.classList.toggle('collapsed');}
};
window._calc_toggleDetail = function(btn) {
    var block = btn.closest('.output-block');
    var content = block ? block.querySelector('.detail-content') : null;
    if(content) {
        content.classList.toggle('show');
        var t=btn.querySelector('.dt-txt'),ch=btn.querySelector('.dt-chev');
        if(t)t.textContent=content.classList.contains('show')?'收起详情':'查看详情';
        if(ch)ch.classList.toggle('open');
    }
};

// ============================================================
// 路由
// ============================================================
(function () {
    'use strict';
    var routes = {
        '':'renderHome', 'home':'renderHome', 'vehicles':'renderVehicles',
        'balance':'renderBalance', 'calculator':'renderCalculator', 'chips':'renderChips',
        'empower':'renderEmpower', 'resources':'renderResources', 'pools':'renderPools', 'activities':'renderActivities', 'act-ending':'renderActEnding',
        'free-achievements':'renderAchievements',
        'wallpaper-static':'renderWallpaperStatic', 'wallpaper-live':'renderWallpaperLive',
        'cg':'renderCG', 'pv':'renderPV',
    };
    function getRoute() {
        var h = window.location.hash.replace('#/','').replace('#','').split('/')[0].toLowerCase();
        return routes[h] ? h : 'home';
    }
    function navigate() {
        // 离开计算器时保存所选车辆
        var calcSelect = document.getElementById('_calc_vehicleSelect');
        if (calcSelect) window._calcLastVehicle = calcSelect.value;
        var route = getRoute();
        // 跳转定位场景（活动/奖池带目标名）不强制滚顶——必须在 fn() 执行前捕获，
        // 因为渲染函数内部会消费并清空 _actJumpName/_poolJumpName
        var hasJumpTarget = !!(window._actJumpName || window._poolJumpName);
        var fn = window[routes[route]];
        if (typeof fn === 'function') fn();
        if (!hasJumpTarget) window.scrollTo(0, 0);
        document.querySelectorAll('.nav-links a').forEach(function (a) {
            a.classList.toggle('active', a.getAttribute('href') === '#/' + route || (route === 'home' && a.getAttribute('href') === '#/'));
        });
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('navToggle').classList.remove('open');
    }
    // 注意：hashchange 统一由下方主逻辑监听处理（含数据加载判断 + modal 清理），这里不重复注册
    window.Router = { navigate: navigate, getRoute: getRoute };
})();

// ============================================================
// 主逻辑
// ============================================================
(function () {
    'use strict';
    var dataLoaded = false, pendingHash = null;
    var DATA_FILES = [
        { key:'DATA_VEHICLES', path:'vehicles.json' },
        { key:'DATA_BALANCE', path:'balance.json' },
        { key:'DATA_CHIP_RECS', path:'chip_recs.json' },
        { key:'DATA_TERMS', path:'terms.json' },
        { key:'DATA_CHIPS', path:'chips.json' },
        { key:'DATA_EMPOWER', path:'energies.json' },
        { key:'DATA_RESOURCES', path:'resources.json' },
        { key:'DATA_POOLS', path:'pools.json' },
        { key:'DATA_ACTIVITIES', path:'activities.json' },
        { key:'DATA_ACHIEVEMENTS', path:'achievements.json' },
        { key:'DATA_WALLPAPERS', path:'wallpapers.json' },
        { key:'DATA_MEDIA', path:'media.json' },
    ];
    function loadAllData(cb) {
        var n = DATA_FILES.length;
        DATA_FILES.forEach(function (f) {
            fetch(f.path).then(function (r) { if (!r.ok) throw Error(); return r.json(); })
                .then(function (d) {
                    // vehicles.json 是对象 { vehicles: [...] }，提取数组
                    if (f.key === 'DATA_VEHICLES' && d && typeof d === 'object' && !Array.isArray(d)) {
                        var arr = d.vehicles || Object.values(d)[0];
                        if (Array.isArray(arr)) { window[f.key] = arr; return; }
                    }
                    window[f.key] = d;
                })
                .catch(function () { window[f.key] = []; })
                .finally(function () { n--; if (n === 0 && cb) cb(); });
        });
    }
    var navToggle = document.getElementById('navToggle');
    var navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', function () { navLinks.classList.toggle('open'); navToggle.classList.toggle('open'); });
    navLinks.addEventListener('click', function (e) { if (e.target.tagName === 'A') { navLinks.classList.remove('open'); navToggle.classList.remove('open'); } });
    window.addEventListener('hashchange', function () {
        var m = document.getElementById('modal'); if (m) m.remove();
        if (dataLoaded && window.Router) window.Router.navigate(); else pendingHash = window.location.hash;
    });
    loadAllData(function () {
        dataLoaded = true;
        if (window.Router) {
            var h = pendingHash || window.location.hash;
            if (!h || h === '#') window.location.hash = '#/home';
            else window.Router.navigate();
        }
        console.log('🏎️ 王牌竞速数据整合站已启动');
    });
})();
</script>
<script>
(function(){
  var w = document.getElementById('cyberWelcome');
  var c = document.getElementById('cyberClose');
  if (w && c) {
    // 关闭欢迎弹窗并记录：同标签页刷新/重置后不再弹出，重开标签页仍会显示
    function closeWelcome(){
      w.style.display = 'none';
      try{ sessionStorage.setItem('wwClosed','1'); }catch(e){}
    }
    // 本次会话已关闭过（例如点过重置刷新页面）：直接隐藏
    if (sessionStorage.getItem('wwClosed')) { w.style.display = 'none'; }
    c.addEventListener('click', closeWelcome);
    w.addEventListener('click', function(e){ if (e.target === w) closeWelcome(); });
  }
  // 社交图标点击代理（tracker 层会拦截原生链接，用坐标命中判断跳转）
  var canvas = document.querySelector('.ww-canvas');
  if (canvas) {
    var icons = document.querySelectorAll('.ww-social');
    canvas.addEventListener('mousemove', function(e){
      var x = e.clientX, y = e.clientY;
      for (var i = 0; i < icons.length; i++) {
        var r = icons[i].getBoundingClientRect();
        icons[i].classList.toggle('hover', x >= r.left && x <= r.right && y >= r.top && y <= r.bottom);
      }
    });
    canvas.addEventListener('mouseleave', function(){
      for (var i = 0; i < icons.length; i++) icons[i].classList.remove('hover');
    });
    canvas.addEventListener('click', function(e){
      var x = e.clientX, y = e.clientY;
      for (var i = 0; i < icons.length; i++) {
        var r = icons[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          var href = icons[i].getAttribute('href');
          if (href && href !== '#') { window.open(href, '_blank'); return; }
        }
      }
      // 公告新站点链接（tracker 层会拦截原生链接，坐标命中跳转）
      var links = document.querySelectorAll('.ww-site-link');
      for (var j = 0; j < links.length; j++) {
        var lr = links[j].getBoundingClientRect();
        if (x >= lr.left && x <= lr.right && y >= lr.top && y <= lr.bottom) {
          var lhref = links[j].getAttribute('href');
          if (lhref) { window.open(lhref, '_blank'); return; }
        }
      }
    });
  }
  // 手机端：点击卡片切换头像/标题界面
  var wwCard = document.querySelector('.ww-card');
  if (wwCard) {
    wwCard.addEventListener('click', function(e){
      var x = e.clientX, y = e.clientY;
      var icons = document.querySelectorAll('.ww-social');
      for (var i = 0; i < icons.length; i++) {
        var r = icons[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return;
      }
      // 公告新站点链接：点击不触发卡片翻转
      var links = document.querySelectorAll('.ww-site-link');
      for (var j = 0; j < links.length; j++) {
        var lr = links[j].getBoundingClientRect();
        if (x >= lr.left && x <= lr.right && y >= lr.top && y <= lr.bottom) return;
      }
      if (c) {
        var cr = c.getBoundingClientRect();
        if (x >= cr.left && x <= cr.right && y >= cr.top && y <= cr.bottom) return;
      }
      wwCard.classList.toggle('flip');
    });
  }
})();
</script>

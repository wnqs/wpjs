<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="#/" class="nav-logo">
                <span class="logo-text">王牌竞速<span class="logo-sub">数据站</span></span>
            </a>
            <div class="nav-toggle" id="navToggle">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#/vehicles">车辆数据</a></li>
                <li><a href="#/balance">平衡性调整</a></li>
                <li><a href="#/calculator">芯片要求计算器</a></li>
                <li><a href="#/chips">芯片系统</a></li>
                <li><a href="#/empower">赋能系统</a></li>
                <li><a href="#/resources">资源获取</a></li>
                <li><a href="#/wallpaper-static">静态壁纸</a></li>
                <li><a href="#/wallpaper-live">动态壁纸</a></li>
                <li><a href="#/cg">CG</a></li>
                <li><a href="#/pv">PV</a></li>
            </ul>
        </div>
    </nav>
    <main id="app"></main>
    <footer class="footer">
        <div class="footer-inner">
            <p>王牌竞速数据整合站 &mdash; 玩家共建站</p>
            <p class="footer-meta">数据仅供参考，以游戏内实际版本为准</p>
        </div>
    </footer>

<script>
// ============================================================
// 页面渲染函数
// ============================================================

// ----- home.js -----
window.renderHome = function () {
    const navItems = [
        { icon: '车辆',   name: '车辆数据',     desc: '全车辆图鉴与属性',   route: 'vehicles' },
        { icon: '平衡',   name: '平衡性调整',   desc: '版本更新调整记录',   route: 'balance' },
        { icon: '计算',   name: '芯片要求计算器', desc: '芯片升级所需数量计算', route: 'calculator' },
        { icon: '芯片',   name: '芯片系统',     desc: '芯片图鉴与搭配',     route: 'chips' },
        { icon: '赋能',   name: '赋能系统',     desc: '赋能模块与推荐',     route: 'empower' },
        { icon: '资源',   name: '资源获取',     desc: '全资源获取途径',     route: 'resources' },
        { icon: '壁纸',   name: '静态壁纸',     desc: '精美壁纸收藏',       route: 'wallpaper-static' },
        { icon: '动态',   name: '动态壁纸',     desc: '动态壁纸展示',       route: 'wallpaper-live' },
        { icon: 'CG',    name: 'CG',          desc: '游戏CG动画',         route: 'cg' },
        { icon: 'PV',    name: 'PV',          desc: '宣传视频合集',       route: 'pv' },
    ];
    const updates = window.DATA_BALANCE ? window.DATA_BALANCE.slice(0, 3) : [];
    var html = '<div class="page">';
    html += '<section class="hero">';
    html += '<h1>王牌竞速数据整合站</h1>';
    html += '<p>一站式查询车辆图鉴、芯片赋能攻略、版本平衡性调整与游戏媒体资源</p>';
    html += '</section>';
    html += '<div class="quick-nav">';
    navItems.forEach(function (item) {
        html += '<div class="quick-card" onclick="window.location.hash=\'#/' + item.route + '\'">';
        html += '<div class="quick-icon">' + item.icon + '</div>';
        html += '<h3>' + item.name + '</h3>';
        html += '<p>' + item.desc + '</p>';
        html += '</div>';
    });
    html += '</div>';
    if (updates.length) {
        html += '<section class="recent-updates">';
        html += '<h2>最近更新</h2>';
        updates.forEach(function (u) {
            html += '<div class="update-item">';
            html += '<span class="version">' + (u.version || '') + '</span>';
            html += '<span class="date">' + (u.date || '') + '</span>';
            html += '<div class="desc">' + (u.summary || u.content || '') + '</div>';
            html += '</div>';
        });
        html += '</section>';
    }
    html += '</div>';
    document.getElementById('app').innerHTML = html;
};

// ----- vehicles.js -----
const ICONS = {
    type: {
        '竞速': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/3dff9aca-3af3-47c0-bf76-cce424c2d846.png',
        '干扰': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/3275e576-7547-4a19-94e9-71725a09c902.png',
        '辅助': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/76986bb0-a074-42e8-9f7a-acf66eb19ea3.png',
        '评分': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/57b6bd90-c852-4ee7-9720-e9a58f07914c.png',
    },
    track: {
        '城市': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/cab840bc-ee68-4bff-9d26-0919a8836907.png',
        '山路': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/fb120b3c-bceb-4d2d-b282-428f6d0bbf3a.png',
        '场地': 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/9bdee65d-6c29-4170-ba12-cd60bf8fdfac.png',
    },
    rating: 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/57b6bd90-c852-4ee7-9720-e9a58f07914c.png',
    glory_bg: 'https://backend.appmiaoda.com/projects/supabase316894448002838528/storage/v1/object/public/images/fc890049-ab85-47b7-8d66-a3959f3862b9.png',
};
const RARITY_CLASS = { '传说':'legendary', '史诗':'epic', '稀有':'rare', '普通':'common', '耀世':'glory' };
const CAR_EMOJIS = { 'Blade':'🏎️', 'Interceptor':'🚔', '支援者X':'🚙', '耀世·极光':'✨', '冲刺者':'🚗' };

window.renderVehicles = function () {
    var vehicles = window.DATA_VEHICLES || [];
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>车辆数据</h1><p>全车辆图鉴 — 类型 / 稀有度 / 赛道适性</p></div>';
    var types = [{ label:'全部',type:'全部' },{ label:'竞速',type:'竞速' },{ label:'干扰',type:'干扰' },{ label:'辅助',type:'辅助' },{ label:'综合评分',type:'评分' }];
    html += '<div class="v-filter-bar" id="vFilter">';
    types.forEach(function (t) {
        var iconUrl = ICONS.type[t.type];
        html += '<button class="v-filter-btn' + (t.type === '全部' ? ' active' : '') + '" data-type="' + t.type + '">';
        if (iconUrl) html += '<img src="' + iconUrl + '" alt="" class="filter-type-icon" onerror="this.style.display=\'none\'"> ';
        html += t.label + '</button>';
    });
    html += '</div><div class="vehicle-grid" id="vGrid">';
    vehicles.forEach(function (v) { html += renderVehicleCard(v); });
    html += '</div>';
    html += '<div class="v-legend">';
    html += '<span>图例：</span>';
    html += '<span class="legend-item"><img src="' + ICONS.rating + '" alt=""> 综合评分</span>';
    html += '<span class="legend-item" style="margin-left:12px;">赛道适性：</span>';
    html += '<span class="legend-item"><img src="' + ICONS.track['城市'] + '" alt=""> 城市</span>';
    html += '<span class="legend-item"><img src="' + ICONS.track['山路'] + '" alt=""> 山路</span>';
    html += '<span class="legend-item"><img src="' + ICONS.track['场地'] + '" alt=""> 场地</span>';
    html += '</div></div>';
    app.innerHTML = html;
    document.getElementById('vFilter').addEventListener('click', function (e) {
        var btn = e.target.closest('.v-filter-btn');
        if (!btn) return;
        document.querySelectorAll('#vFilter .v-filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var type = btn.getAttribute('data-type');
        document.querySelectorAll('#vGrid .v-card').forEach(function (card) {
            card.style.display = (type === '全部' || type === '评分' || card.getAttribute('data-type') === type) ? '' : 'none';
        });
    });
    document.getElementById('vGrid').addEventListener('click', function (e) {
        var card = e.target.closest('.v-card');
        if (!card) return;
        var v = vehicles.find(function (x) { return x.id === card.getAttribute('data-id'); });
        if (v) showVehicleDetail(v);
    });
};

function renderVehicleCard(v) {
    var rarityKey = RARITY_CLASS[v.rarity] || 'common';
    var typeIcon = ICONS.type[v.type] || '';
    var ratingIcon = ICONS.rating;
    var tracksHtml = '';
    if (Array.isArray(v.tracks)) {
        v.tracks.forEach(function (t) {
            var trackUrl = ICONS.track[t];
            if (trackUrl) tracksHtml += '<div class="track-icon" title="' + t + '"><img src="' + trackUrl + '" alt="' + t + '"></div>';
        });
    }
    return '<div class="v-card rarity-' + rarityKey + '" data-id="' + v.id + '" data-type="' + v.type + '">' +
        '<div class="v-card-inner">' +
        '<div class="v-card-header rarity-' + rarityKey + '">' +
        (typeIcon ? '<div class="v-card-type-badge"><img src="' + typeIcon + '" alt="' + v.type + '"></div>' : '') +
        '<div class="v-card-rating"><img src="' + ratingIcon + '" alt="评分"><span>' + v.rating + '</span></div>' +
        '<div class="v-card-emblem">' + (CAR_EMOJIS[v.name] || '🚗') + '</div>' +
        '</div>' +
        '<div class="v-card-body"><div class="v-card-name">' + v.name + '</div>' +
        (tracksHtml ? '<div class="v-card-tracks"><span class="track-label">赛道</span>' + tracksHtml + '</div>' : '') +
        '</div></div></div>';
}

function showVehicleDetail(v) {
    var typeIcon = ICONS.type[v.type] || '';
    var ratingIcon = ICONS.rating;
    var badgesHtml = '';
    if (typeIcon) badgesHtml += '<span class="badge"><img src="' + typeIcon + '" alt=""> ' + v.type + '</span>';
    if (Array.isArray(v.tracks)) {
        v.tracks.forEach(function (t) {
            var url = ICONS.track[t];
            if (url) badgesHtml += '<span class="badge"><img src="' + url + '" alt=""> ' + t + '</span>';
        });
    }
    badgesHtml += '<span class="badge"><img src="' + ratingIcon + '" alt=""> 评分 ' + v.rating + '</span>';
    var html = '<div class="modal-overlay" id="modal"><div class="modal-content">' +
        '<button class="modal-close" id="modalClose">&times;</button>' +
        '<div class="v-modal-header"><div class="v-modal-emblem">' + (CAR_EMOJIS[v.name] || '🚗') + '</div>' +
        '<div class="v-modal-title"><h2>' + v.name + '</h2>' +
        '<span class="v-modal-rarity" style="background:' + getRarityColor(v.rarity) + '20;color:' + getRarityColor(v.rarity) + ';">' + v.rarity + '</span>' +
        '</div></div><div class="v-modal-badges">' + badgesHtml + '</div>' +
        '<table class="info-table">' +
        '<tr><td>技能名称</td><td>' + (v.skill_name || '-') + '</td></tr>' +
        '<tr><td>技能描述</td><td>' + (v.skill_desc || '-') + '</td></tr>' +
        (v.skill_cd ? '<tr><td>技能冷却</td><td>' + v.skill_cd + '</td></tr>' : '') +
        (v.max_speed ? '<tr><td>极速</td><td>' + v.max_speed + '</td></tr>' : '') +
        (v.acceleration ? '<tr><td>加速</td><td>' + v.acceleration + '</td></tr>' : '') +
        (v.handling ? '<tr><td>操控</td><td>' + v.handling + '</td></tr>' : '') +
        (v.recommend_chips ? '<tr><td>推荐芯片</td><td>' + v.recommend_chips + '</td></tr>' : '') +
        (v.recommend_empower ? '<tr><td>推荐赋能</td><td>' + v.recommend_empower + '</td></tr>' : '') +
        '</table></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var close = function () { document.getElementById('modal').remove(); };
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') close(); });
}

function getRarityColor(r) { switch(r){ case'传说':return'#ff6a00'; case'史诗':return'#a855f7'; case'稀有':return'#3b82f6'; case'普通':return'#22c55e'; case'耀世':return'#ffd700'; default:return'#94a3b8'; } }

// ----- balance.js -----
window.renderBalance = function () {
    var data = window.DATA_BALANCE || [];
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>平衡性调整</h1><p>各版本车辆 / 芯片 / 赋能系统调整记录</p></div>';
    if (!data.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div>';
    } else {
        data.forEach(function (item) {
            html += '<div class="update-item" style="margin-bottom:14px;">';
            html += '<span class="version">' + (item.version || '') + '</span>';
            html += '<span class="date">' + (item.date || '') + '</span>';
            html += '<div class="desc" style="margin-top:8px;">';
            if (item.summary) html += '<p style="color:var(--text-secondary);margin-bottom:8px;">' + item.summary + '</p>';
            if (Array.isArray(item.changes)) {
                item.changes.forEach(function (c) {
                    var arrow = c.direction === '增强' ? '⬆️' : c.direction === '削弱' ? '⬇️' : c.direction === '调整' ? '🔄' : '';
                    html += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">';
                    html += '<span style="color:var(--accent-cyan);font-weight:600;">' + (c.target || '') + '</span> ';
                    if (arrow) html += '<span>' + arrow + '</span> ';
                    html += '<span style="color:var(--text-secondary);font-size:0.88rem;">' + (c.content || '') + '</span></div>';
                });
            }
            if (item.content) html += '<p style="color:var(--text-secondary);font-size:0.88rem;">' + item.content + '</p>';
            html += '</div></div>';
        });
    }
    html += '</div>';
    app.innerHTML = html;
};

// ----- chips.js -----
window.renderChips = function () {
    var chips = window.DATA_CHIPS || [];
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>芯片系统</h1><p>芯片图鉴 — 套装效果 / 推荐搭配</p></div>';
    if (!chips.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div></div>';
        app.innerHTML = html; return;
    }
    html += '<div class="filter-bar" id="chipFilter">';
    ['全部','传说','史诗','稀有'].forEach(function (r) {
        html += '<button class="filter-btn' + (r === '全部' ? ' active' : '') + '" data-rarity="' + r + '">' + r + '</button>';
    });
    html += '</div><div class="card-grid" id="chipGrid">';
    chips.forEach(function (c) {
        var tag = 'tag-' + (c.rarity === '传说' ? 'legendary' : c.rarity === '史诗' ? 'epic' : 'rare');
        html += '<div class="card chip-card" data-id="' + c.id + '" data-rarity="' + c.rarity + '"><div class="card-body">' +
            '<h3>' + (c.icon || '💠') + ' ' + c.name + '</h3><div class="tags">' +
            '<span class="tag ' + tag + '">' + c.rarity + '</span>' +
            (c.set_name ? '<span class="tag" style="background:rgba(0,240,255,0.1);color:var(--accent-cyan);">' + c.set_name + '</span>' : '') +
            '</div><div class="desc">' + (c.effect || '') + '</div>' +
            (c.suit_desc ? '<div class="meta">套装：' + c.suit_desc + '</div>' : '') + '</div></div>';
    });
    html += '</div></div>';
    app.innerHTML = html;
    document.getElementById('chipFilter').addEventListener('click', function (e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('#chipFilter .filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var r = btn.getAttribute('data-rarity');
        document.querySelectorAll('#chipGrid .chip-card').forEach(function (card) {
            card.style.display = (r === '全部' || card.getAttribute('data-rarity') === r) ? '' : 'none';
        });
    });
    document.getElementById('chipGrid').addEventListener('click', function (e) {
        var card = e.target.closest('.chip-card');
        if (!card) return;
        var c = chips.find(function (x) { return x.id === card.getAttribute('data-id'); });
        if (c) showChipDetail(c);
    });
};
function showChipDetail(c) {
    var html = '<div class="modal-overlay" id="modal"><div class="modal-content">' +
        '<button class="modal-close" id="modalClose">&times;</button>' +
        '<h2>' + (c.icon || '💠') + ' ' + c.name + '</h2>' +
        '<table class="info-table">' +
        '<tr><td>稀有度</td><td>' + c.rarity + '</td></tr>' +
        (c.set_name ? '<tr><td>所属套装</td><td>' + c.set_name + '</td></tr>' : '') +
        (c.effect ? '<tr><td>单件效果</td><td>' + c.effect + '</td></tr>' : '') +
        (c.suit_desc ? '<tr><td>套装效果</td><td>' + c.suit_desc + '</td></tr>' : '') +
        (c.recommend ? '<tr><td>推荐搭配</td><td>' + c.recommend + '</td></tr>' : '') +
        '</table></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var close = function () { document.getElementById('modal').remove(); };
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') close(); });
}

// ----- empower.js -----
window.renderEmpower = function () {
    var data = window.DATA_EMPOWER || [];
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>赋能系统</h1><p>赋能模块图鉴 — 效果 / 解锁 / 推荐方案</p></div>';
    if (!data.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div></div>';
        app.innerHTML = html; return;
    }
    html += '<div class="card-grid" id="empowerGrid">';
    data.forEach(function (item, idx) {
        html += '<div class="card" data-empower-idx="' + idx + '"><div class="card-body">';
        html += '<h3>' + (item.icon || '🔮') + ' ' + item.name + '</h3>';
        html += '<div class="tags">';
        if (item.type) html += '<span class="tag" style="background:rgba(168,85,247,0.2);color:var(--accent-purple);">' + item.type + '</span>';
        html += '</div><div class="desc">' + (item.effect || '') + '</div>';
        if (item.unlock) html += '<div class="meta">解锁条件：' + item.unlock + '</div>';
        html += '</div></div>';
    });
    html += '</div></div>';
    app.innerHTML = html;
    document.getElementById('empowerGrid').addEventListener('click', function (e) {
        var card = e.target.closest('.card');
        if (!card) return;
        var idx = parseInt(card.getAttribute('data-empower-idx'), 10);
        if (!isNaN(idx) && data[idx]) showEmpowerDetail(data[idx]);
    });
};
window.showEmpowerDetail = function (item) {
    var html = '<div class="modal-overlay" id="modal"><div class="modal-content">' +
        '<button class="modal-close" id="modalClose">&times;</button>' +
        '<h2>' + (item.icon || '🔮') + ' ' + item.name + '</h2>' +
        '<table class="info-table">' +
        (item.type ? '<tr><td>类型</td><td>' + item.type + '</td></tr>' : '') +
        (item.effect ? '<tr><td>效果</td><td>' + item.effect + '</td></tr>' : '') +
        (item.unlock ? '<tr><td>解锁条件</td><td>' + item.unlock + '</td></tr>' : '') +
        (item.level_max ? '<tr><td>最高等级</td><td>' + item.level_max + '</td></tr>' : '') +
        (item.recommend ? '<tr><td>推荐方案</td><td>' + item.recommend + '</td></tr>' : '') +
        '</table></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var close = function () { document.getElementById('modal').remove(); };
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') close(); });
};

// ----- resources.js -----
window.renderResources = function () {
    var data = window.DATA_RESOURCES || [];
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>资源获取</h1><p>各类资源的获取途径一览</p></div>';
    if (!data.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div></div>';
        app.innerHTML = html; return;
    }
    html += '<div class="data-table-wrap"><table class="data-table">';
    html += '<thead><tr><th>资源名称</th><th>类型</th><th>获取途径</th><th>备注</th></tr></thead><tbody>';
    data.forEach(function (item) {
        html += '<tr><td style="font-weight:600;color:var(--text-primary);">' + (item.icon || '') + ' ' + item.name + '</td>';
        html += '<td>' + (item.type || '-') + '</td>';
        html += '<td>' + (Array.isArray(item.ways) ? item.ways.join('<br>') : item.ways || '-') + '</td>';
        html += '<td style="color:var(--text-muted);font-size:0.82rem;">' + (item.notes || '-') + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    app.innerHTML = html;
};

// ----- wallpapers.js -----
window.renderWallpaperStatic = function () { renderWallpaper('static', '静态壁纸', '精美游戏壁纸收藏'); };
window.renderWallpaperLive = function () { renderWallpaper('live', '动态壁纸', '动态壁纸 / 视频壁纸展示'); };
function renderWallpaper(type, title, subtitle) {
    var all = window.DATA_WALLPAPERS || [];
    var data = all.filter(function (w) { return w.type === type; });
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>' + title + '</h1><p>' + subtitle + '</p></div>';
    if (!data.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div></div>';
        app.innerHTML = html; return;
    }
    html += '<div class="gallery-grid">';
    data.forEach(function (item) {
        html += '<div class="gallery-item" onclick="previewMedia(' + JSON.stringify(item).replace(/"/g, '&quot;') + ')">';
        if (type === 'static') {
            html += '<img src="' + (item.url || '') + '" alt="' + item.name + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22225%22><rect fill=%221e293b%22 width=%22400%22 height=%22225%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%2264748b%22 font-size=%2216%22>暂无预览</text></svg>\'">';
        } else {
            html += '<video src="' + (item.url || '') + '" muted loop preload="metadata" onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0;"></video>';
        }
        html += '<div class="gallery-label">' + item.name + '</div></div>';
    });
    html += '</div></div>';
    app.innerHTML = html;
}
window.previewMedia = function (item) {
    var innerHtml = item.type === 'static'
        ? '<img src="' + item.url + '" alt="' + item.name + '" style="max-width:100%;max-height:70vh;border-radius:8px;margin:0 auto;display:block;" onerror="this.alt=\'图片加载失败\'">'
        : '<video src="' + item.url + '" controls autoplay style="max-width:100%;max-height:70vh;border-radius:8px;display:block;" onerror="this.outerHTML=\'<p style=color:var(--text-muted);>视频加载失败</p>\'"></video>';
    var html = '<div class="modal-overlay" id="modal"><div class="modal-content" style="text-align:center;">' +
        '<button class="modal-close" id="modalClose">&times;</button>' +
        '<h2>' + item.name + '</h2>' + innerHtml +
        (item.download ? '<a href="' + item.download + '" target="_blank" style="display:inline-block;margin-top:12px;padding:8px 24px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));color:#fff;border-radius:8px;font-weight:600;">下载</a>' : '') +
        '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var close = function () { document.getElementById('modal').remove(); };
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') close(); });
};

// ----- media.js (CG & PV) -----
window.renderCG = function () { renderMedia('cg', 'CG', '游戏CG动画合集'); };
window.renderPV = function () { renderMedia('pv', 'PV', '宣传视频合集'); };
function renderMedia(type, title, subtitle) {
    var all = window.DATA_MEDIA || [];
    var data = all.filter(function (m) { return m.type === type; });
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>' + title + '</h1><p>' + subtitle + '</p></div>';
    if (!data.length) {
        html += '<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><p>暂无数据</p></div></div>';
        app.innerHTML = html; return;
    }
    html += '<div class="gallery-grid">';
    data.forEach(function (item) {
        html += '<div class="gallery-item" onclick="playMedia(' + JSON.stringify(item).replace(/"/g, '&quot;') + ')">';
        if (item.thumbnail) {
            html += '<img src="' + item.thumbnail + '" alt="' + item.name + '" loading="lazy" onerror="this.style.display=\'none\'">';
        } else {
            html += '<div style="width:100%;height:100%;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;font-size:3rem;">' + (type === 'cg' ? '🎥' : '📺') + '</div>';
        }
        html += '<div class="gallery-label"><span style="display:block;font-size:0.8rem;">' + item.name + '</span>' +
            (item.duration ? '<span style="font-weight:400;font-size:0.7rem;color:var(--text-muted);">' + item.duration + '</span>' : '') +
            '</div></div>';
    });
    html += '</div></div>';
    app.innerHTML = html;
}
window.playMedia = function (item) {
    var html = '<div class="modal-overlay" id="modal"><div class="modal-content">' +
        '<button class="modal-close" id="modalClose">&times;</button>' +
        '<h2>' + item.name + '</h2>' +
        '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;background:#000;">';
    if (item.embed_url) {
        html += '<iframe src="' + item.embed_url + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allowfullscreen></iframe>';
    } else if (item.url) {
        html += '<video src="' + item.url + '" controls autoplay style="position:absolute;top:0;left:0;width:100%;height:100%;" onerror="this.outerHTML=\'<p style=color:var(--text-muted);text-align:center;padding:40px;>视频加载失败</p>\'"></video>';
    } else {
        html += '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text-muted);">暂无视频源</div>';
    }
    html += '</div>' + (item.desc ? '<p style="color:var(--text-secondary);font-size:0.85rem;margin-top:12px;">' + item.desc + '</p>' : '') + '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var close = function () { document.getElementById('modal').remove(); };
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') close(); });
};

// ----- calculator.js -----
window.renderCalculator = function () {
    var data = window.DATA_CALCULATOR || { cost_table:{}, rarity_names:{}, max_level:10 };
    var costTable = data.cost_table || {};
    var rarityNames = data.rarity_names || {};
    var maxLevel = data.max_level || 10;
    var app = document.getElementById('app');
    var html = '<div class="page">';
    html += '<div class="page-header"><h1>芯片要求计算器</h1><p>计算芯片从当前等级升至目标等级所需的芯片数量</p></div>';
    html += '<div class="calc-card"><div class="calc-form">';
    html += '<div class="calc-row"><label>当前等级</label><div class="calc-input-group">';
    html += '<button class="calc-btn" onclick="adjustLevel(-1,' + maxLevel + ')">−</button>';
    html += '<input type="number" id="curLevel" value="1" min="1" max="' + maxLevel + '" readonly>';
    html += '<button class="calc-btn" onclick="adjustLevel(1,' + maxLevel + ')">+</button></div></div>';
    html += '<div class="calc-row"><label>目标等级</label><div class="calc-input-group">';
    html += '<button class="calc-btn" onclick="adjustTarget(-1,' + maxLevel + ')">−</button>';
    html += '<input type="number" id="tarLevel" value="' + maxLevel + '" min="1" max="' + maxLevel + '" readonly>';
    html += '<button class="calc-btn" onclick="adjustTarget(1,' + maxLevel + ')">+</button></div></div>';
    html += '<div class="calc-row"><label>芯片稀有度</label>';
    html += '<select id="chipRarity" class="calc-select">';
    Object.keys(rarityNames).forEach(function (k) {
        html += '<option value="' + k + '"' + (k === 'epic' ? ' selected' : '') + '>' + rarityNames[k] + '</option>';
    });
    html += '</select></div>';
    html += '<button class="calc-submit" onclick="doCalculate()">计算所需芯片</button>';
    html += '</div><div class="calc-result" id="calcResult" style="display:none;">';
    html += '<h3>计算结果</h3><div class="result-items" id="resultItems"></div></div></div>';
    html += '<div class="calc-note"><p><strong>升级规则：</strong></p><ul>';
    html += '<li>稀有芯片：每级需要 1 个同类型芯片</li>';
    html += '<li>史诗芯片：1-5级每级 1 个，6-10级每级 2 个</li>';
    html += '<li>传说芯片：1-3级每级 1 个，4-6级每级 2 个，7-10级每级 3 个</li>';
    html += '<li>升级不会失败，消耗对应数量的同类型芯片</li></ul></div></div>';
    app.innerHTML = html;
};
window.adjustLevel = function (d, m) {
    var i = document.getElementById('curLevel');
    var v = parseInt(i.value,10) + d;
    var t = parseInt(document.getElementById('tarLevel').value,10);
    if (v<1) v=1; if (v>m) v=m; if (v>=t) v=t-1; if (v<1) v=1;
    i.value = v;
};
window.adjustTarget = function (d, m) {
    var i = document.getElementById('tarLevel');
    var v = parseInt(i.value,10) + d;
    var c = parseInt(document.getElementById('curLevel').value,10);
    if (v<2) v=2; if (v>m) v=m; if (v<=c) v=c+1; if (v>m) v=m;
    i.value = v;
};
window.doCalculate = function () {
    var data = window.DATA_CALCULATOR || { cost_table:{}, rarity_names:{} };
    var costs = data.cost_table || {};
    var names = data.rarity_names || {};
    var cur = parseInt(document.getElementById('curLevel').value,10);
    var tar = parseInt(document.getElementById('tarLevel').value,10);
    var rarity = document.getElementById('chipRarity').value;
    var tbl = costs[rarity] || [];
    if (cur >= tar) { alert('目标等级必须大于当前等级'); return; }
    var total = 0, details = [];
    for (var i = cur+1; i <= tar; i++) { var n = tbl[i]||1; total+=n; details.push({l:i, n:n}); }
    document.getElementById('calcResult').style.display = '';
    var h = '<div class="result-summary"><span class="result-total">总计：<strong>' + total + '</strong> 个</span>';
    h += '<span class="result-meta">' + (names[rarity]||rarity) + '芯片 · ' + cur + '级 → ' + tar + '级</span></div>';
    h += '<table class="result-table"><tr><th>目标等级</th><th>所需芯片数</th></tr>';
    details.forEach(function (d) { h += '<tr><td>' + d.l + '级</td><td>' + d.n + ' 个</td></tr>'; });
    h += '<tr class="result-total-row"><td><strong>总计</strong></td><td><strong>' + total + ' 个</strong></td></tr></table>';
    document.getElementById('resultItems').innerHTML = h;
};

// ============================================================
// 路由
// ============================================================
(function () {
    'use strict';
    var routes = {
        '':'renderHome', 'home':'renderHome', 'vehicles':'renderVehicles',
        'balance':'renderBalance', 'calculator':'renderCalculator', 'chips':'renderChips',
        'empower':'renderEmpower', 'resources':'renderResources',
        'wallpaper-static':'renderWallpaperStatic', 'wallpaper-live':'renderWallpaperLive',
        'cg':'renderCG', 'pv':'renderPV',
    };
    function getRoute() {
        var h = window.location.hash.replace('#/','').replace('#','').split('/')[0].toLowerCase();
        return routes[h] ? h : 'home';
    }
    function navigate() {
        var route = getRoute();
        var fn = window[routes[route]];
        if (typeof fn === 'function') fn();
        document.querySelectorAll('.nav-links a').forEach(function (a) {
            a.classList.toggle('active', a.getAttribute('href') === '#/' + route || (route === 'home' && a.getAttribute('href') === '#/'));
        });
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('navToggle').classList.remove('open');
    }
    window.addEventListener('hashchange', navigate);
    window.Router = { navigate: navigate, getRoute: getRoute };
})();

// ============================================================
// 主逻辑
// ============================================================
(function () {
    'use strict';
    var dataLoaded = false, pendingHash = null;
    var DATA_FILES = [
        { key:'DATA_VEHICLES', path:'vehicles.json' },
        { key:'DATA_BALANCE', path:'balance.json' },
        { key:'DATA_CALCULATOR', path:'calculator.json' },
        { key:'DATA_CHIPS', path:'chips.json' },
        { key:'DATA_EMPOWER', path:'empower.json' },
        { key:'DATA_RESOURCES', path:'resources.json' },
        { key:'DATA_WALLPAPERS', path:'wallpapers.json' },
        { key:'DATA_MEDIA', path:'media.json' },
    ];
    function loadAllData(cb) {
        var n = DATA_FILES.length;
        DATA_FILES.forEach(function (f) {
            fetch(f.path).then(function (r) { if (!r.ok) throw Error(); return r.json(); })
                .then(function (d) { window[f.key] = d; })
                .catch(function () { window[f.key] = []; })
                .finally(function () { n--; if (n === 0 && cb) cb(); });
        });
    }
    var navToggle = document.getElementById('navToggle');
    var navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', function () { navLinks.classList.toggle('open'); navToggle.classList.toggle('open'); });
    navLinks.addEventListener('click', function (e) { if (e.target.tagName === 'A') { navLinks.classList.remove('open'); navToggle.classList.remove('open'); } });
    window.addEventListener('hashchange', function () {
        var m = document.getElementById('modal'); if (m) m.remove();
        if (dataLoaded && window.Router) window.Router.navigate(); else pendingHash = window.location.hash;
    });
    loadAllData(function () {
        dataLoaded = true;
        if (window.Router) {
            var h = pendingHash || window.location.hash;
            if (!h || h === '#') window.location.hash = '#/home';
            else window.Router.navigate();
        }
        console.log('🏎️ 王牌竞速数据整合站已启动');
    });
})();
</script>
